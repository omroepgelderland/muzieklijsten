<html lang="nl-NL">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noai, noimageai" />
    <title>Losse nummers toevoegen</title>
    <link
      rel="icon"
      href="/assets/afbeeldingen/favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="icon"
      href="/assets/afbeeldingen/favicon-32p.png"
      sizes="32x32"
      type="image/png"
    />
    <link rel="icon" href="/assets/afbeeldingen/favicon.ico" sizes="any" />
    <link
      rel="apple-touch-icon"
      href="/assets/afbeeldingen/apple-touch-icon.png"
      sizes="180x180"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#272727"
      media="(prefers-color-scheme: dark)"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <i class="bi bi-music-note-beamed" aria-hidden="true"></i>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#main-navbar"
          aria-controls="main-navbar"
          aria-expanded="false"
          aria-label="Navigatie aan- en uitzetten"
        >
          <i class="bi bi-list"></i>
        </button>

        <!-- Nav links -->
        <div class="collapse navbar-collapse" id="main-navbar">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="admin.html">Beheer</a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link active"
                aria-current="page"
                href="los-toevoegen.html"
                >Losse nummers toevoegen</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="mod-vrijekeuzes.html"
                >Moderatie vrije keuzes</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container" id="login-error-container" hidden>
      <div class="alert alert-danger" id="login-error-message"></div>
    </div>
    <div class="container" id="losse-nummers-content" hidden>
      <h1>Losse nummers toevoegen</h1>
      <div class="alert alert-danger" id="error-alert" hidden>
        <span id="error-message"></span>
      </div>
      <form id="losse-nummers-form">
        <div class="mb-3 row">
          <hr />
          <h2>Toevoegen aan lijsten</h2>
          <div id="lijst-container" class="row g-3"></div>
        </div>
        <div>
          <hr />
          <h2>Nummers toevoegen</h2>
          <table class="table">
            <thead>
              <tr>
                <th class="kolom-breed">Artiest</th>
                <th class="kolom-breed">Titel</th>
                <th class="kolom-smal">Jaartal</th>
                <th class="kolom-smal">Lengte</th>
              </tr>
            </thead>
            <tbody id="nummer-rows"></tbody>
          </table>
        </div>
        <p>
          <span id="een-toegevoegd" hidden>
            Er is één nummer toegevoegd aan de database.
          </span>
          <span id="meerdere-toegevoegd" hidden></span>
          <span id="een-dubbel" hidden
            >één nummer stond al in de database.</span
          >
          <span id="meerdere-dubbel" hidden></span>
          <span id="een-lijst-toegevoegd" hidden>
            Één nummer is aan een stemlijst toegevoegd.
          </span>
          <span id="meerdere-lijst-toegevoegd" hidden></span>
        </p>
        <button type="submit" class="btn btn-primary">Toevoegen</button>
      </form>
    </div>
  </body>
</html>
