<div class="modal fade resultaten-modal" role="dialog">
  <div class="modal-dialog modal-fullscreen">
    <div class="modal-content">
      <div class="modal-header modal-top">
        <h4 class="modal-title">
          Resultaten van de lijst ‘<span class="lijst-naam"></span>’
        </h4>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <form class="filters" autocomplete="off">
          <div class="row g-2 justify-content-xxl-between">
            <div class="col-6 col-lg-3 col-xxl-2">
              <input
                type="text"
                name="filter-nummers"
                class="form-control"
                placeholder="Filter nummers"
              />
            </div>
            <div class="col-6 col-lg-3 col-xxl-2">
              <input
                type="text"
                name="filter-stemmers"
                class="form-control"
                placeholder="Filter stemmers"
              />
            </div>
            <div
              class="col-6 col-lg-3 col-xxl-auto d-flex align-items-center flex-nowrap"
            >
              <label for="filter-van" class="col-form-label mb-0 me-2"
                >van:</label
              >
              <div class="flex-grow-1">
                <input
                  type="date"
                  id="filter-van"
                  name="van"
                  class="form-control w-auto"
                />
              </div>
            </div>
            <div
              class="col-6 col-lg-3 col-xxl-auto d-flex align-items-center flex-nowrap"
            >
              <label for="filter-tot" class="col-form-label mb-0 me-2"
                >tot:</label
              >
              <div class="flex-grow-1">
                <input
                  type="date"
                  id="filter-tot"
                  name="tot"
                  class="form-control w-auto"
                />
              </div>
            </div>
            <div class="col-auto">
              <input
                type="submit"
                value="Filters toepassen"
                class="btn btn-primary"
              />
            </div>
            <div class="col-auto">
              <input
                type="reset"
                value="Filters wissen"
                class="btn btn-primary"
              />
            </div>
          </div>
        </form>
        <div class="table-responsive">
          <table class="table table-striped">
            <thead>
              <tr>
                <th></th>
                <th>Titel</th>
                <th>Artiest</th>
                <th>Lengte</th>
                <th class="text-center">
                  <span class="totaal-aantal-stemmen"></span> stemmen<br />
                  <span class="totaal-aantal-stemmers"></span> stemmers
                </th>
              </tr>
            </thead>
            <tbody class="resultaten-tabel"></tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer modal-end">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Sluiten
        </button>
      </div>
    </div>
  </div>
</div>
